name: Update ARCHER2 training catalogue

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-archer2-training:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run ARCHER2 scraper
        run: |
          python scripts/update_archer2_training.py

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- _data/external-training.csv; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Show CSV changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git diff -- _data/external-training.csv

      - name: Create branch
        if: steps.changes.outputs.changed == 'true'
        run: |
          BRANCH_NAME="automation/archer2-training"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH_NAME"

          echo "BRANCH_NAME=$BRANCH_NAME" >> "$GITHUB_ENV"

      - name: Commit changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git add _data/external-training.csv

          git commit \
            -m "Update ARCHER2 training courses"

      - name: Push branch
        if: steps.changes.outputs.changed == 'true'
        run: |
          git push --force-with-lease origin "$BRANCH_NAME"

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ env.BRANCH_NAME }}
        run: |
          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "Update ARCHER2 training courses" \
            --body "## ARCHER2 training catalogue update

          This pull request was automatically generated by the ARCHER2 training scraper.

          The scraper checks the current ARCHER2 training catalogue and:
          - adds new scheduled courses;
          - updates existing ARCHER2 courses when their details change;
          - preserves manually curated tags;
          - does not automatically remove courses that disappear from ARCHER2.

          Please review the changes before merging."

      - name: No changes
        if: steps.changes.outputs.changed == 'false'
        run: |
          echo "No changes detected in the ARCHER2 training catalogue."