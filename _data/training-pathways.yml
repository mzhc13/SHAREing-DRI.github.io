# _data/training-pathways.yml
#
# Curated learning pathways for the External Training Catalogue.
# Each pathway is shown as ONE continuous line of numbered steps, with
# optional "spin-offs" hanging off a step as side branches.
#
# Each pathway has:
#   id           unique short name (for your own reference)
#   title        shown on the card (required)
#   icon         a single emoji
#   audience     short "who is this for" line
#   description  one or two sentences
#   courses      the main line, in order. Each step is either:
#                  - a plain URL, or
#                  - a mapping with:
#                      url        (required)
#                      note       (optional short hint shown under the step)
#                      spinoffs   (optional list of side branches; each is
#                                  a URL or a mapping with url + note)
#
# "Use pathway" / "+ Add to mine" load the main line only. Spin-offs are
# optional extras that can be added one by one.
#
# Every `url` must match the `url` column in _data/external-training.csv
# EXACTLY (including http/https and any trailing slash).
#
# Steps whose course has expired (or been removed from the CSV) are skipped
# automatically, and the card shows "X of Y courses currently available".
# Note: if a main step is skipped, its spin-offs are skipped with it.


- id: performance-track
  title: "Performance Assessment"
  icon: "🚀"
  audience: "Developers who want faster, more efficient code"
  description: "Core-level, node-level and GPU performance engineering, plus tool-based tuning."
  courses:
    - url: "https://librarycarpentry.org/lc-shell/"
    - url: "https://www.archer2.ac.uk/training/courses/240000-intro-hpc-self-service/"
    - url: "https://training-academy.dirac.ac.uk/enrol/index.php?id=23"
    - url: "https://www.archer2.ac.uk/training/courses/210000-mpi-self-service/"
      spinoffs:
        - url: "https://www.archer2.ac.uk/training/courses/210000-openmp-self-service/"
    - url: "https://shareing-dri.github.io/hpc-concepts-course/"
    - url: "https://www.vi-hps.org/training/tws/tuning-workshop-series.html"

